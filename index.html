function trDom(r){const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),L=[];let n;while((n=w.nextNode()))L.push(n);L.forEach(n=>{const v=n.nodeValue,k=v.trim();if(!k)return;let o=TR[k];if(!o)for(const x of RX){if(x[0].test(k)){o=k.replace(x[0],x[1]);break}}if(o)n.nodeValue=v.replace(k,o)});r.querySelectorAll('[placeholder]').forEach(e=>{const o=TR[e.getAttribute('placeholder')];if(o)e.setAttribute('placeholder',o)})}

function sha256js(s){var m=unescape(encodeURIComponent(s)),b=[],i,K=[],H=[],p=2,c=0;
for(i=0;i<m.length;i++)b[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);
var l=m.length*8;b[l>>5]|=0x80<<(24-l%32);b[(((l+64)>>9)<<4)+15]=l;for(i=0;i<b.length;i++)b[i]|=0;
while(c<64){var ok=true;for(var d=2;d*d<=p;d++)if(p%d==0){ok=false;break}if(ok){K[c]=Math.floor((Math.cbrt(p)%1)*4294967296)|0;if(c<8)H[c]=Math.floor((Math.sqrt(p)%1)*4294967296)|0;c++}p++}
function R(x,n){return(x>>>n)|(x<<(32-n))}
for(var o=0;o<b.length;o+=16){var w=b.slice(o,o+16),a=H[0],bb=H[1],cc=H[2],dd=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
for(var t=0;t<64;t++){if(t>=16){var s0=R(w[t-15],7)^R(w[t-15],18)^(w[t-15]>>>3),s1=R(w[t-2],17)^R(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0}
var S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[t]+w[t])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;
h=g;g=f;f=e;e=(dd+t1)|0;dd=cc;cc=bb;bb=a;a=(t1+t2)|0}
H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+dd)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
return H.map(function(x){return('00000000'+(x>>>0).toString(16)).slice(-8)}).join('')}
async function sha(t){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(t)}
